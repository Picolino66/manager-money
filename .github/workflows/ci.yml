name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Estrutura (ADR-019/022): npm workspaces na raiz (lockfile único) com packages/core (núcleo
# compartilhado), app/ (mobile Expo) e client/ (web). `npm ci` roda na raiz; cada job usa -w.
# supabase/ = backend compartilhado · raiz = workspace do produto (docs, scripts).

jobs:
  core:
    name: Núcleo compartilhado — lint, tipos, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify -w @manager-money/core

  app:
    name: App mobile — lint, tipos, testes e cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify -w app
      - name: Validação da configuração Expo
        working-directory: app
        run: npx expo config --type public > /dev/null
      - name: Auditoria de dependências (bloqueia crítica)
        # Altas/moderadas restantes são ferramentas de build do Expo SDK — ver docs/quality/security-report.md
        run: npm audit --omit=dev --audit-level=critical -w app

  client:
    name: Client web — lint, tipos, testes, build e auditoria
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores fictícios só para o build do CI (o build exige as variáveis públicas; nada se conecta).
      VITE_SUPABASE_URL: https://ci.supabase.invalid
      VITE_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w client
      - run: npm run typecheck -w client
      - run: npm run test:coverage -w client
      - run: npm run build -w client
      - name: Auditoria de dependências (bloqueia crítica)
        run: npm audit --omit=dev --audit-level=critical -w client
      # E2E (Playwright) fica local: usa o projeto Supabase real com usuário de teste.

  docs:
    name: Knowledge layer (docs/.ai)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # docs:check usa o commit atual
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run docs:check

  database:
    name: Migrations e RLS (Postgres 15)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash supabase/tests/run-plain.sh

  secrets:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
